# Convenção de pasta do Supabase CLI (a CLI NÃO é dependência do projeto). As migrations ficam em supabase/migrations/
# e são revisadas no PR e aplicadas depois; ver supabase/README.md.
project_id = "timoteo-app"

[db]
major_version = 17

# Edge Functions da Fase 4 (cobrança). O webhook é chamado pelo Mercado Pago, que não envia JWT do Supabase;
# a autenticação dele é o x-signature, conferido no código.
[functions.create-checkout]
verify_jwt = true

[functions.verify-payment]
verify_jwt = true

[functions.mp-webhook]
verify_jwt = false

# Conciliação diária (Fase 4): chamada pelo GitHub Actions com o segredo RECONCILE_SECRET no cabeçalho x-reconcile-secret.
[functions.reconcile-payments]
verify_jwt = false

# Exclusão de conta (Fase 7): exige JWT do usuário (e o e-mail digitado, conferido no código).
[functions.delete-account]
verify_jwt = true
