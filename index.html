<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Timóteo App" />

    <style>html{background:#f8f7f2}html[data-theme='dark']{background:#141615}</style>
    <!-- Aplica o tema do site antes do primeiro desenho (sem piscar). Padrão: claro; só vai ao escuro com a escolha guardada (ou o sistema, no automático). -->
    <script>try{var p=JSON.parse(localStorage.getItem('readingPrefs')||'null'),t=p&&p.v&&p.v.siteTheme,d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');if(d)document.querySelector('meta[name="theme-color"]').setAttribute('content','#141615')}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
