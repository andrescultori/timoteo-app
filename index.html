    <!-- Aplica o tema salvo antes do primeiro desenho, para não piscar o fundo errado -->
    <script>try{var t=localStorage.getItem('theme'),d=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',r=t==='dark'?'dark':t==='auto'?d:'light';document.documentElement.setAttribute('data-theme',r);if(r==='dark')document.querySelector('meta[name="theme-color"]').setAttribute('content','#17130e')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
    <style>html{background:#fbf9f3}html[data-theme='dark']{background:#17130e}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
